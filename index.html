<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Warehouse Scan System</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

body{
  font-family:Arial;
  background:#0b0f14;
  color:#d7e1ea;
  margin:0;
}

/* NAV */
#nav{
  display:flex;
  background:#121a22;
  border-bottom:1px solid #1f2a36;
  padding:10px;
  gap:10px;
  align-items:center;
}

.navItem{
  padding:8px 12px;
  cursor:pointer;
  border-radius:6px;
  background:#1a2430;
}

.navItem:hover{background:#243244;}
.navItem.active{background:#1f6feb;}

/* LAYOUT */
.container{padding:20px;}

.card{
  background:#121a22;
  padding:15px;
  border-radius:8px;
  border:1px solid #1f2a36;
}

/* INPUTS */
input,select{
  width:100%;
  padding:10px;
  margin:5px 0;
  background:#0f151c;
  color:white;
  border:1px solid #263241;
}

/* BUTTONS */
button{
  padding:10px;
  margin-top:8px;
  background:#1f6feb;
  border:none;
  color:white;
  cursor:pointer;
  border-radius:6px;
}

/* STATUS */
.status{
  margin-top:10px;
  color:#7ee787;
  font-weight:bold;
}

.error{color:#ff6b6b;}

/* HIDDEN */
.hidden{display:none;}

/* MOBILE VIEW */
.bigNumber{
  font-size:60px;
  font-weight:bold;
  text-align:center;
  margin:20px 0;
}

.bigLabel{
  text-align:center;
  font-size:18px;
  opacity:0.8;
}

.mobileBox{
  text-align:center;
}

.mobileScan{
  font-size:22px;
  padding:18px;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" class="container">
  <div class="card">
    <h2>Login</h2>
    <input id="email" placeholder="Email">
    <input id="password" type="password">
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

<!-- NAV -->
<div id="nav">
  <div class="navItem active" onclick="showPage('scanner')">Scanner</div>
  <div class="navItem" onclick="showPage('rules')">Rules</div>
  <div class="navItem" onclick="showPage('mobile')">Mobile View</div>

  <div style="margin-left:auto;display:flex;gap:10px;align-items:center;">
    <span>Rules:</span>
    <button onclick="toggleRules()" id="rulesBtn">OFF</button>
  </div>
</div>

<div class="container">

<!-- SCANNER -->
<div id="scannerPage">

<div class="card">

<select id="destinationSelect">
  <option value="">Select Destination</option>
  <option value="CENTRAL">Central</option>
  <option value="CDW">CDW</option>
  <option value="INTERPLANT">Interplant</option>
  <option value="KVILLE">Kville</option>
</select>

<input id="scanInput" placeholder="Scan Data Matrix">

<div class="status">
Total Scanned: <span id="totalCount">0</span>
</div>

<div class="status">
Total Weight: <span id="totalWeight">0.000</span>
</div>

<div class="status" id="status"></div>

<table>
<thead>
<tr>
<th>GMID</th>
<th>Batch</th>
<th>Qty</th>
<th>Weight</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

</div>
</div>

<!-- RULES -->
<div id="rulesPage" class="hidden">
<div class="card">

<h3>Rules</h3>

<select id="ruleDestination">
  <option value="">Select Destination</option>
  <option value="CENTRAL">Central</option>
  <option value="CDW">CDW</option>
  <option value="INTERPLANT">Interplant</option>
  <option value="KVILLE">Kville</option>
</select>

<input id="ruleGMID" placeholder="GMID">

<button onclick="addRule()">Add Rule</button>

<table>
<tbody id="rulesTable"></tbody>
</table>

</div>
</div>

<!-- MOBILE VIEW -->
<div id="mobilePage" class="hidden">

<div class="card mobileBox">

<div class="bigLabel">TOTAL SCANNED</div>
<div class="bigNumber" id="mTotal">0</div>

<div class="bigLabel">LAST SCAN</div>
<div class="status" id="lastScan">None</div>

<input id="mobileScan" class="mobileScan" placeholder="SCAN HERE">

</div>

</div>

</div>

<audio id="beepSound" src="beep.mp3"></audio>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyCJFDM58excT8iD6guuJyQajLxxnFVsHEg",
  authDomain: "warehouse-scanner-1b6bc.firebaseapp.com",
  databaseURL: "https://warehouse-scanner-1b6bc-default-rtdb.firebaseio.com",
  projectId: "warehouse-scanner-1b6bc",
  storageBucket: "warehouse-scanner-1b6bc.appspot.com",
  messagingSenderId: "347483666604",
  appId: "1:347483666604:web:cc30686d262c0e3376c709"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let buffer="";
let timer=null;
let rulesEnabled=false;
let lastScanKey=null;

// LOGIN
function login(){
  auth.signInWithEmailAndPassword(
    document.getElementById("email").value,
    document.getElementById("password").value
  );
}

// AUTH
auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    startApp();
  }
});

// NAV
function showPage(page){

  document.getElementById("scannerPage").classList.add("hidden");
  document.getElementById("rulesPage").classList.add("hidden");
  document.getElementById("mobilePage").classList.add("hidden");

  document.querySelectorAll(".navItem")
    .forEach(n=>n.classList.remove("active"));

  if(page==="scanner"){
    document.getElementById("scannerPage").classList.remove("hidden");
    document.querySelectorAll(".navItem")[0].classList.add("active");
  }

  if(page==="rules"){
    document.getElementById("rulesPage").classList.remove("hidden");
    document.querySelectorAll(".navItem")[1].classList.add("active");
  }

  if(page==="mobile"){
    document.getElementById("mobilePage").classList.remove("hidden");
    document.querySelectorAll(".navItem")[2].classList.add("active");

    document.getElementById("mobileScan").focus();
  }
}

// START
function startApp(){

  const input=document.getElementById("scanInput");

  input.addEventListener("input",()=>{
    buffer=input.value;
    clearTimeout(timer);

    timer=setTimeout(()=>{
      if(buffer.length>10) processScan(buffer);
      input.value="";
      buffer="";
    },100);
  });

  db.ref("scans").on("value",snap=>{

    const data=snap.val()||{};
    const summary={};

    let total=0;
    let totalWeight=0;
    let last="None";

    Object.values(data).forEach(i=>{
      total++;
      totalWeight+=i.weight;
      last=`${i.gmid} | ${i.batch}`;

      const key=i.gmid+"|"+i.batch;

      if(!summary[key]){
        summary[key]={gmid:i.gmid,batch:i.batch,qty:0,weight:0};
      }

      summary[key].qty++;
      summary[key].weight+=i.weight;
    });

    document.getElementById("totalCount").innerText=total;
    document.getElementById("totalWeight").innerText=totalWeight.toFixed(3);

    document.getElementById("mTotal").innerText=total;
    document.getElementById("lastScan").innerText=last;

    render(summary);
  });
}

// SCAN
function processScan(scan){

  let gmid="",batch="",weight=0;

  const parts=scan.split(";");

  for(let p of parts){
    if(p.startsWith("0100")) gmid=p.slice(-7);
    else if(p.startsWith("10")) batch=p.substring(2);
    else if(p.startsWith("3103")) weight=parseInt(p.substring(4))/1000;
  }

  if(!gmid||!batch||!weight){
    errorBeep();
    return;
  }

  const dest=document.getElementById("destinationSelect").value;
  if(!dest){
    errorBeep();
    return;
  }

  db.ref("scans").push({
    gmid,batch,weight,dest,time:Date.now()
  });

  playBeep();
}

// BEEP
function playBeep(){
  const b=document.getElementById("beepSound");
  b.currentTime=0;
  b.play().catch(()=>{});
}

function errorBeep(){
  const b=document.getElementById("beepSound");
  b.currentTime=0;
  b.play().catch(()=>{});
  setTimeout(()=>b.play().catch(()=>{}),200);
}

// RULES
function toggleRules(){
  rulesEnabled=!rulesEnabled;
  document.getElementById("rulesBtn").innerText=
    rulesEnabled?"ON":"OFF";
}

function addRule(){
  const d=document.getElementById("ruleDestination").value;
  const g=document.getElementById("ruleGMID").value.trim();
  if(!d||!g)return;
  db.ref("rules/"+d+"/"+g).set(true);
}

// RENDER
function render(summary){
  const t=document.getElementById("table");
  t.innerHTML="";
  Object.values(summary).forEach(i=>{
    const r=t.insertRow();
    r.insertCell(0).innerText=i.gmid;
    r.insertCell(1).innerText=i.batch;
    r.insertCell(2).innerText=i.qty;
    r.insertCell(3).innerText=i.weight.toFixed(3);
  });
}

</script>

</body>
</html>
