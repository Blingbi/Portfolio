<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trailer Scan System</title>

<style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background-color: #f5f5f5;
    }

    h1 {
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        padding: 15px;
        font-size: 22px;
        box-sizing: border-box;
        margin-bottom: 15px;
    }

    button {
        padding: 12px 18px;
        font-size: 16px;
        margin-right: 10px;
        cursor: pointer;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        margin-top: 20px;
    }

    th, td {
        border: 1px solid #ccc;
        padding: 10px;
        text-align: left;
    }

    th {
        background-color: #eaeaea;
    }

    .status {
        margin-top: 15px;
        font-weight: bold;
    }
</style>
</head>

<body>

<h1>Trailer Scan System</h1>

<label><strong>Scan Data Matrix Barcode</strong></label>
<input type="text" id="scanInput" autofocus placeholder="Scan barcode here">

<button onclick="exportCSV()">Export Summary CSV</button>
<button onclick="resetData()">RESET ALL DATA</button>

<div class="status" id="status"></div>

<table>
    <thead>
        <tr>
            <th>GMID</th>
            <th>Batch</th>
            <th>Drum Qty</th>
            <th>Total Weight</th>
        </tr>
    </thead>
    <tbody id="summaryTable"></tbody>
</table>

<script>

const scanInput = document.getElementById("scanInput");
const summaryTable = document.getElementById("summaryTable");
const statusDiv = document.getElementById("status");

let data = {};

scanInput.addEventListener("keydown", function(e) {

    if (e.key === "Enter") {

        e.preventDefault();

        const scan = scanInput.value.trim();

        if (!scan) return;

        processScan(scan);

        scanInput.value = "";
    }
});

function processScan(scan) {

    /*
    EXAMPLE INPUT:

    ~LBL;010004133965;10H052PB4104;3103227000;11;17

    WHAT WE WANT:
    GMID = 4133965
    Batch = H052PB4104
    Weight = 227
    */

    let gmid = "";
    let batch = "";
    let weight = 0;

    const parts = scan.split(";");

    for (let part of parts) {

        // GMID section
        // 010004133965
        if (part.startsWith("0100")) {

            // pull last 7 digits
            gmid = part.slice(-7);
        }

        // Batch section
        // 10H052PB4104
        else if (part.startsWith("10")) {

            batch = part.substring(2);
        }

        // Weight section
        // 3103227000
        else if (part.startsWith("3103")) {

            /*
            GS1 AI 3103 means:
            weight with 3 decimal places

            227000 -> 227.000
            */

            let rawWeight = part.substring(4);

            weight = parseInt(rawWeight) / 1000;
        }
    }

    if (!gmid || !batch || !weight) {

        statusDiv.innerText =
            "Could not parse barcode data";

        return;
    }

    const key = gmid + "|" + batch;

    if (!data[key]) {

        data[key] = {
            gmid: gmid,
            batch: batch,
            qty: 0,
            totalWeight: 0
        };
    }

    data[key].qty += 1;
    data[key].totalWeight += weight;

    renderSummary();

    statusDiv.innerText =
        `Scanned GMID ${gmid} | Batch ${batch} | Weight ${weight}`;
}

function renderSummary() {

    summaryTable.innerHTML = "";

    for (let key in data) {

        let item = data[key];

        const row = summaryTable.insertRow();

        row.insertCell(0).innerText = item.gmid;
        row.insertCell(1).innerText = item.batch;
        row.insertCell(2).innerText = item.qty;
        row.insertCell(3).innerText =
            item.totalWeight.toFixed(3);
    }
}

function exportCSV() {

    let csv =
        "GMID,Batch,DrumQty,TotalWeight\n";

    for (let key in data) {

        let item = data[key];

        csv +=
            `${item.gmid},${item.batch},${item.qty},${item.totalWeight.toFixed(3)}\n`;
    }

    const blob =
        new Blob([csv], { type: "text/csv" });

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;
    a.download = "trailer_summary.csv";

    a.click();
}

function resetData() {

    if (confirm("Clear all scanned data?")) {

        data = {};

        summaryTable.innerHTML = "";

        statusDiv.innerText =
            "All scan data cleared";
    }
}

</script>

</body>
</html>
