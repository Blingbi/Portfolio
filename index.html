<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Warehouse Scan System</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#0b0f14;
  color:#d7e1ea;
}

#nav{
  display:flex;
  gap:10px;
  padding:10px;
  background:#121a22;
  border-bottom:1px solid #1f2a36;
}

.navItem{
  padding:8px 12px;
  background:#1a2430;
  border-radius:6px;
  cursor:pointer;
}

.navItem.active{background:#1f6feb;}

.container{padding:20px}

.hidden{display:none}

input,select{
  width:100%;
  padding:10px;
  margin:5px 0;
  background:#0f151c;
  color:white;
  border:1px solid #263241;
  box-sizing:border-box;
}

button{
  padding:10px;
  margin-top:8px;
  background:#1f6feb;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.status{margin-top:10px;color:#7ee787}

/* hidden scanner inputs */
#gunScan, #mobileGun{
  position:absolute;
  left:-9999px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,td{
  border:1px solid #223040;
  padding:8px;
}

.big{
  font-size:70px;
  font-weight:900;
  text-align:center;
}

</style>
</head>

<body>

<!-- NAV -->
<div id="nav">
  <div class="navItem" onclick="show('scanner')">Scanner</div>
  <div class="navItem" onclick="show('rules')">Rules</div>
  <div class="navItem" onclick="show('mobile')">Mobile</div>
</div>

<div class="container">

<!-- SCANNER -->
<div id="scanner">

<select id="dest">
  <option value="">Optional Destination</option>
  <option>Central</option>
  <option>CDW</option>
  <option>Interplant</option>
  <option>Kville</option>
</select>

<input id="gunScan" autocomplete="off">

<div class="big" id="total">0</div>
<div class="status">TOTAL SCANNED</div>
<div class="status">TOTAL WEIGHT: <span id="weight">0</span></div>

<button onclick="exportExcel()">Export Excel</button>
<button onclick="resetAll()">Reset</button>

<table>
<thead>
<tr>
<th>GMID</th>
<th>Batch</th>
<th>Dest</th>
<th>Qty</th>
<th>Weight</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

</div>

<!-- RULES -->
<div id="rules" class="hidden">

<input id="ruleSearch" placeholder="Search rules" oninput="renderRules()">

<select id="ruleDest">
  <option>Central</option>
  <option>CDW</option>
  <option>Interplant</option>
  <option>Kville</option>
</select>

<input id="ruleGMID" placeholder="GMID">

<button onclick="addRule()">Add Rule</button>
<button onclick="toggleRules()">Toggle Rules</button>

<table>
<tbody id="rulesTable"></tbody>
</table>

</div>

<!-- MOBILE -->
<div id="mobile" class="hidden">

<input id="mobileGun" autocomplete="off">

<div class="big" id="mTotal">0</div>
<div class="status">MOBILE TOTAL</div>

</div>

</div>

<script>

const db = firebase.initializeApp({
  databaseURL:"https://warehouse-scanner-1b6bc-default-rtdb.firebaseio.com"
}).database();

/* STATE */
let buffer="";
let timer=null;
let lastKey="";
let lastTime=0;

let rulesEnabled=true;
let rules=[];

/* NAV */
function show(p){

  document.getElementById("scanner").classList.add("hidden");
  document.getElementById("rules").classList.add("hidden");
  document.getElementById("mobile").classList.add("hidden");

  document.getElementById(p).classList.remove("hidden");

  setTimeout(()=>{
    if(p==="scanner") gunScan.focus();
    if(p==="mobile") mobileGun.focus();
  },100);
}

/* CORE SCAN */
function scan(raw){

  let g="",b="",w=0;

  for(let p of raw.split(";")){
    if(p.startsWith("0100")) g=p.slice(-7);
    if(p.startsWith("10")) b=p.slice(2);
    if(p.startsWith("3103")) w=parseInt(p.slice(4))/1000;
  }

  if(!g||!b||!w) return;

  let key=g+"|"+b;
  let now=Date.now();

  if(key===lastKey && now-lastTime<900) return;

  lastKey=key;
  lastTime=now;

  let dest=document.getElementById("dest").value||"UNASSIGNED";

  db.ref("scans").push({
    gmid:g,
    batch:b,
    weight:w,
    dest:dest,
    time:now
  });
}

/* SCANNER INPUT */
const gunScan=document.getElementById("gunScan");

gunScan.addEventListener("input",e=>{
  buffer=e.target.value;
  clearTimeout(timer);

  timer=setTimeout(()=>{
    scan(buffer);
    e.target.value="";
    gunScan.focus();
  },60);
});

/* MOBILE INPUT */
const mobileGun=document.getElementById("mobileGun");

mobileGun.addEventListener("input",e=>{
  buffer=e.target.value;
  clearTimeout(timer);

  timer=setTimeout(()=>{
    scan(buffer);
    e.target.value="";
    mobileGun.focus();
  },60);
});

/* LIVE DATA */
db.ref("scans").on("value",snap=>{

  let data=snap.val()||{};
  let total=0;
  let weight=0;
  let table={};

  Object.values(data).forEach(i=>{

    total++;
    weight+=i.weight;

    let k=i.gmid+"|"+i.batch;

    if(!table[k]){
      table[k]={gmid:i.gmid,batch:i.batch,dest:i.dest,qty:0,weight:0};
    }

    table[k].qty++;
    table[k].weight+=i.weight;
  });

  document.getElementById("total").innerText=total;
  document.getElementById("mTotal").innerText=total;
  document.getElementById("weight").innerText=weight.toFixed(3);

  let t=document.getElementById("table");
  t.innerHTML="";

  Object.values(table).forEach(i=>{
    let r=t.insertRow();
    r.insertCell(0).innerText=i.gmid;
    r.insertCell(1).innerText=i.batch;
    r.insertCell(2).innerText=i.dest;
    r.insertCell(3).innerText=i.qty;
    r.insertCell(4).innerText=i.weight.toFixed(3);
  });
});

/* EXPORT EXCEL */
function exportExcel(){

  db.ref("scans").once("value").then(snap=>{

    let data=snap.val()||{};
    let out={};

    Object.values(data).forEach(i=>{

      let k=i.gmid+"|"+i.batch+"|"+i.dest;

      if(!out[k]){
        out[k]={GMID:i.gmid,Batch:i.batch,Dest:i.dest,Qty:0,Weight:0};
      }

      out[k].Qty++;
      out[k].Weight+=i.weight;
    });

    let rows=Object.values(out).map(i=>({
      GMID:i.GMID,
      Batch:i.Batch,
      Destination:i.Dest,
      Qty:i.Qty,
      Weight:i.Weight.toFixed(3)
    }));

    let ws=XLSX.utils.json_to_sheet(rows);
    let wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Scans");

    XLSX.writeFile(wb,"warehouse.xlsx");
  });
}

/* RESET */
function resetAll(){
  if(confirm("Clear all scans?")){
    db.ref("scans").remove();
  }
}

/* RULES */
function addRule(){
  rules.push({
    dest:ruleDest.value,
    gmid:ruleGMID.value
  });
}

function toggleRules(){
  rulesEnabled=!rulesEnabled;
}

function renderRules(){
  let t=document.getElementById("rulesTable");
  t.innerHTML="";
  rules.forEach(r=>{
    let row=t.insertRow();
    row.insertCell(0).innerText=r.dest;
    row.insertCell(1).innerText=r.gmid;
  });
}

</script>

</body>
</html>
