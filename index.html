<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Warehouse Scan System</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#0b0f14;
  color:#d7e1ea;
}

#nav{
  display:flex;
  background:#121a22;
  border-bottom:1px solid #1f2a36;
  padding:10px;
  gap:10px;
}

.navItem{
  padding:8px 12px;
  cursor:pointer;
  border-radius:6px;
  background:#1a2430;
}

.navItem.active{background:#1f6feb;}

.container{
  padding:20px;
  max-width:1200px;
  margin:auto;
}

.card{
  background:#121a22;
  padding:15px;
  border-radius:8px;
  border:1px solid #1f2a36;
}

input,select{
  width:100%;
  padding:10px;
  margin:5px 0;
  background:#0f151c;
  color:white;
  border:1px solid #263241;
  box-sizing:border-box;
}

button{
  padding:10px;
  margin-top:8px;
  background:#1f6feb;
  border:none;
  color:white;
  cursor:pointer;
  border-radius:6px;
}

.status{
  margin-top:10px;
  color:#7ee787;
  font-weight:bold;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
  table-layout:fixed;
}

th,td{
  border:1px solid #223040;
  padding:10px;
  word-wrap:break-word;
}

th{
  background:#1a2430;
  color:#9fd3ff;
}

.hidden{display:none;}

/* hidden scan inputs */
#gunScan, #mobileGun{
  position:absolute;
  left:-9999px;
}

.mobileBox{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

.bigLabel{
  font-size:26px;
  opacity:0.8;
  margin-top:20px;
}

.bigNumber{
  font-size:120px;
  font-weight:900;
  margin:10px 0;
}

</style>
</head>

<body>

<!-- NAV -->
<div id="nav">
  <div class="navItem active" onclick="showPage('scanner')">Scanner</div>
  <div class="navItem" onclick="showPage('rules')">Rules</div>
  <div class="navItem" onclick="showPage('mobile')">Mobile</div>
</div>

<div class="container">

<!-- SCANNER -->
<div id="scannerPage">

<div class="card">

<select id="destinationSelect">
  <option value="">No Destination (optional)</option>
  <option value="CENTRAL">Central</option>
  <option value="CDW">CDW</option>
  <option value="INTERPLANT">Interplant</option>
  <option value="KVILLE">Kville</option>
</select>

<input id="scanInput" placeholder="Scan Data Matrix">

<input id="gunScan" autocomplete="off">

<button onclick="exportExcel()">Export Excel</button>
<button onclick="resetAll()">Reset All</button>

<div class="status">
Total Scanned: <span id="totalCount">0</span>
</div>

<div class="status">
Total Weight: <span id="totalWeight">0.000</span>
</div>

<table>
<thead>
<tr>
<th>GMID</th>
<th>Batch</th>
<th>Destination</th>
<th>Qty</th>
<th>Weight</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

<div id="status" class="status"></div>

</div>
</div>

<!-- RULES -->
<div id="rulesPage" class="hidden">
<div class="card">

<h3>Rules</h3>

<input id="ruleSearch" placeholder="Search..." oninput="renderRules()">

<select id="ruleDestination">
  <option value="">Select Destination</option>
  <option value="CENTRAL">Central</option>
  <option value="CDW">CDW</option>
  <option value="INTERPLANT">Interplant</option>
  <option value="KVILLE">Kville</option>
</select>

<input id="ruleGMID" placeholder="GMID">

<button onclick="addRule()">Add Rule</button>

<table>
<thead>
<tr>
<th>Destination</th>
<th>GMID</th>
<th>Delete</th>
</tr>
</thead>
<tbody id="rulesTable"></tbody>
</table>

</div>
</div>

<!-- MOBILE -->
<div id="mobilePage" class="hidden">

<div class="mobileBox">

<div class="bigLabel">TOTAL SCANNED</div>
<div class="bigNumber" id="mTotal">0</div>

<div class="bigLabel">LAST SCAN</div>
<div class="bigNumber" id="lastScan">None</div>

<input id="mobileGun" autocomplete="off">

</div>

</div>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyCJFDM58excT8iD6guuJyQajLxxnFVsHEg",
  authDomain: "warehouse-scanner-1b6bc.firebaseapp.com",
  databaseURL: "https://warehouse-scanner-1b6bc-default-rtdb.firebaseio.com",
  projectId: "warehouse-scanner-1b6bc"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

let buffer = "";
let timer = null;

/* scan lock */
let lastScanKey = "";
let lastScanTime = 0;

/* NAV */
function showPage(p){

  document.getElementById("scannerPage").classList.add("hidden");
  document.getElementById("rulesPage").classList.add("hidden");
  document.getElementById("mobilePage").classList.add("hidden");

  if(p==="scanner"){
    document.getElementById("scannerPage").classList.remove("hidden");
    setTimeout(()=>document.getElementById("gunScan").focus(),150);
  }

  if(p==="rules"){
    document.getElementById("rulesPage").classList.remove("hidden");
  }

  if(p==="mobile"){
    document.getElementById("mobilePage").classList.remove("hidden");
    setTimeout(()=>document.getElementById("mobileGun").focus(),150);
  }
}

/* SHARED SCAN ENGINE */
function processScan(s){

  let g="", b="", w=0;

  for(let p of s.split(";")){
    if(p.startsWith("0100")) g=p.slice(-7);
    if(p.startsWith("10")) b=p.slice(2);
    if(p.startsWith("3103")) w=parseInt(p.slice(4))/1000;
  }

  if(!g || !b || !w) return;

  const key = g+"|"+b;
  const now = Date.now();

  if(key === lastScanKey && (now - lastScanTime) < 1000){
    return;
  }

  lastScanKey = key;
  lastScanTime = now;

  const dest = document.getElementById("destinationSelect").value || "UNASSIGNED";

  db.ref("scans").push({
    gmid:g,
    batch:b,
    weight:w,
    dest:dest,
    time:now
  });
}

/* SCANNER GUN */
document.getElementById("gunScan").addEventListener("input",()=>{
  buffer = document.getElementById("gunScan").value.replace(/\n|\r/g,'');

  clearTimeout(timer);

  timer = setTimeout(()=>{
    if(buffer.length > 3){
      processScan(buffer);
    }

    document.getElementById("gunScan").value="";
    buffer="";
    document.getElementById("gunScan").focus();

  },60);
});

/* MOBILE GUN */
document.getElementById("mobileGun").addEventListener("input",()=>{
  buffer = document.getElementById("mobileGun").value.replace(/\n|\r/g,'');

  clearTimeout(timer);

  timer = setTimeout(()=>{
    if(buffer.length > 3){
      processScan(buffer);
    }

    document.getElementById("mobileGun").value="";
    buffer="";
    document.getElementById("mobileGun").focus();

  },60);
});

/* LIVE DATA */
db.ref("scans").on("value",snap=>{

  const data = snap.val() || {};
  let total=0;
  let weight=0;
  let last="None";

  const summary={};

  Object.values(data).forEach(i=>{
    total++;
    weight+=i.weight;
    last=`${i.gmid} | ${i.batch}`;

    const k=i.gmid+"|"+i.batch;

    if(!summary[k]){
      summary[k]={gmid:i.gmid,batch:i.batch,dest:i.dest,qty:0,weight:0};
    }

    summary[k].qty++;
    summary[k].weight+=i.weight;
  });

  document.getElementById("totalCount").innerText=total;
  document.getElementById("totalWeight").innerText=weight.toFixed(3);
  document.getElementById("mTotal").innerText=total;
  document.getElementById("lastScan").innerText=last;

  const t=document.getElementById("table");
  t.innerHTML="";

  Object.values(summary).forEach(i=>{
    const r=t.insertRow();
    r.insertCell(0).innerText=i.gmid;
    r.insertCell(1).innerText=i.batch;
    r.insertCell(2).innerText=i.dest;
    r.insertCell(3).innerText=i.qty;
    r.insertCell(4).innerText=i.weight.toFixed(3);
  });

});

/* EXPORT */
function exportExcel(){

  db.ref("scans").once("value").then(snap=>{

    const data=snap.val()||{};
    const summary={};

    Object.values(data).forEach(i=>{

      const key=i.gmid+"|"+i.batch+"|"+i.dest;

      if(!summary[key]){
        summary[key]={
          GMID:i.gmid,
          Batch:i.batch,
          Destination:i.dest,
          Qty:0,
          Weight:0
        };
      }

      summary[key].Qty++;
      summary[key].Weight+=i.weight;
    });

    const rows=Object.values(summary).map(i=>({
      GMID:i.GMID,
      Batch:i.Batch,
      Destination:i.Destination,
      Qty:i.Qty,
      Weight:Number(i.Weight.toFixed(3))
    }));

    const ws=XLSX.utils.json_to_sheet(rows);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Warehouse");

    XLSX.writeFile(wb,"warehouse_export.xlsx");
  });
}

/* RESET */
function resetAll(){
  if(confirm("Clear all scans?")){
    db.ref("scans").remove();
  }
}

</script>

</body>
</html>
