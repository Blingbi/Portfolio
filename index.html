<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Warehouse Scan System</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>
    body {
        font-family: Arial;
        padding: 20px;
        background: #f5f5f5;
    }

    input {
        width: 100%;
        padding: 15px;
        font-size: 22px;
        margin-bottom: 10px;
        box-sizing: border-box;
    }

    button {
        padding: 10px 15px;
        margin-right: 10px;
        margin-bottom: 10px;
        cursor: pointer;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        margin-top: 20px;
    }

    th, td {
        border: 1px solid #ccc;
        padding: 8px;
    }

    th {
        background: #eee;
    }

    .status {
        margin-top: 10px;
        font-weight: bold;
    }
</style>
</head>

<body>

<h2>LIVE Warehouse Scan System</h2>

<input id="scanInput" placeholder="Scan Data Matrix..." autofocus>

<button onclick="exportCSV()">EXPORT CSV</button>
<button onclick="resetAll()">RESET ALL DATA</button>

<div class="status" id="status"></div>

<table>
    <thead>
        <tr>
            <th>GMID</th>
            <th>Batch</th>
            <th>Drum Qty</th>
            <th>Total Weight</th>
        </tr>
    </thead>
    <tbody id="table"></tbody>
</table>

<script>

// 🔥 FIREBASE CONFIG (yours)
const firebaseConfig = {
  apiKey: "AIzaSyCJFDM58excT8iD6guuJyQajLxxnFVsHEg",
  authDomain: "warehouse-scanner-1b6bc.firebaseapp.com",
  databaseURL: "https://warehouse-scanner-1b6bc-default-rtdb.firebaseio.com",
  projectId: "warehouse-scanner-1b6bc",
  storageBucket: "warehouse-scanner-1b6bc.appspot.com",
  messagingSenderId: "347483666604",
  appId: "1:347483666604:web:cc30686d262c0e3376c709"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const input = document.getElementById("scanInput");
const table = document.getElementById("table");
const status = document.getElementById("status");

let buffer = "";
let timer = null;

/* ---------------------------
   LIVE FIREBASE LISTENER
---------------------------- */
db.ref("scans").on("value", snap => {

    const data = snap.val() || {};

    const summary = {};

    Object.values(data).forEach(item => {

        const key = item.gmid + "|" + item.batch;

        if (!summary[key]) {
            summary[key] = {
                gmid: item.gmid,
                batch: item.batch,
                qty: 0,
                weight: 0
            };
        }

        summary[key].qty += 1;
        summary[key].weight += item.weight;
    });

    render(summary);
});

/* ---------------------------
   SCAN INPUT HANDLING
---------------------------- */
input.addEventListener("input", () => {

    buffer = input.value;

    clearTimeout(timer);

    timer = setTimeout(() => {

        if (buffer.length > 10) {
            processScan(buffer);
        }

        input.value = "";
        buffer = "";

    }, 120);
});

/* ---------------------------
   PARSE DATA MATRIX
---------------------------- */
function processScan(scan) {

    let gmid = "";
    let batch = "";
    let weight = 0;

    const parts = scan.split(";");

    for (let p of parts) {

        // GMID (0100 + 7 digits)
        if (p.startsWith("0100")) {
            gmid = p.slice(-7);
        }

        // Batch (10 + code)
        else if (p.startsWith("10")) {
            batch = p.substring(2);
        }

        // Weight (3103 GS1 format)
        else if (p.startsWith("3103")) {
            weight = parseInt(p.substring(4)) / 1000;
        }
    }

    if (!gmid || !batch || !weight) {
        status.innerText = "❌ Parse failed";
        return;
    }

    db.ref("scans").push({
        gmid,
        batch,
        weight,
        time: Date.now(),
        device: "FORKLIFT"
    });

    status.innerText =
        `✔ Sent GMID ${gmid} | Batch ${batch} | ${weight}`;
}

/* ---------------------------
   RENDER TABLE
---------------------------- */
function render(summary) {

    table.innerHTML = "";

    Object.values(summary).forEach(item => {

        const row = table.insertRow();

        row.insertCell(0).innerText = item.gmid;
        row.insertCell(1).innerText = item.batch;
        row.insertCell(2).innerText = item.qty;
        row.insertCell(3).innerText = item.weight.toFixed(3);
    });
}

/* ---------------------------
   EXPORT CSV (LIVE SUMMARY)
---------------------------- */
function exportCSV() {

    db.ref("scans").once("value").then(snapshot => {

        const data = snapshot.val() || {};

        const summary = {};

        Object.values(data).forEach(item => {

            const key = item.gmid + "|" + item.batch;

            if (!summary[key]) {
                summary[key] = {
                    gmid: item.gmid,
                    batch: item.batch,
                    qty: 0,
                    weight: 0
                };
            }

            summary[key].qty += 1;
            summary[key].weight += item.weight;
        });

        let csv = "GMID,Batch,DrumQty,TotalWeight\n";

        Object.values(summary).forEach(item => {

            csv += `${item.gmid},${item.batch},${item.qty},${item.weight.toFixed(3)}\n`;
        });

        const blob = new Blob([csv], { type: "text/csv" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "warehouse_summary.csv";
        a.click();

        status.innerText = "✔ CSV exported";

    });
}

/* ---------------------------
   RESET ALL DATA
---------------------------- */
function resetAll() {
    db.ref("scans").remove();
    status.innerText = "✔ All data cleared";
}

</script>

</body>
</html>
