<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Warehouse Scan System</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body {
  font-family: Arial;
  background: #0b0f14;
  color: #d7e1ea;
  padding: 20px;
}

#app, #loginBox {
  background: #121a22;
  padding: 15px;
  border-radius: 8px;
  border: 1px solid #1f2a36;
}

input {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
  background: #0f151c;
  color: #fff;
  border: 1px solid #263241;
}

button {
  margin-top: 8px;
  padding: 10px;
  background: #1f6feb;
  border: none;
  color: white;
  cursor: pointer;
}

.status {
  margin-top: 10px;
  font-weight: bold;
  color: #7ee787;
}

table {
  width: 100%;
  margin-top: 10px;
  border-collapse: collapse;
}

td, th {
  border: 1px solid #223040;
  padding: 6px;
}

th {
  background: #1a2430;
  color: #9fd3ff;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <h2>Login</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app" style="display:none;">

<h2>Warehouse Scanner</h2>

<input id="scanInput" placeholder="Scan Data Matrix">

<button onclick="undoLast()">Undo Last</button>
<button onclick="resetAll()">Reset</button>
<button onclick="exportExcel()">Export Excel</button>
<button onclick="toggleView()">Toggle Raw / Grouped</button>

<div class="status">
  Total Scanned: <span id="totalCount">0</span>
</div>

<div class="status">
  Total Weight: <span id="totalWeight">0.000</span>
</div>

<div class="status" id="status"></div>

<table>
<thead>
<tr>
<th>GMID</th>
<th>Batch</th>
<th>Qty</th>
<th>Weight</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

<audio id="beepSound" src="beep.mp3"></audio>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyCJFDM58excT8iD6guuJyQajLxxnFVsHEg",
  authDomain: "warehouse-scanner-1b6bc.firebaseapp.com",
  databaseURL: "https://warehouse-scanner-1b6bc-default-rtdb.firebaseio.com",
  projectId: "warehouse-scanner-1b6bc",
  storageBucket: "warehouse-scanner-1b6bc.appspot.com",
  messagingSenderId: "347483666604",
  appId: "1:347483666604:web:cc30686d262c0e3376c709"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let buffer = "";
let timer = null;
let appStarted = false;

let lastScanKey = null;
let rawMode = false;

// LOGIN
function login() {
  auth.signInWithEmailAndPassword(
    document.getElementById("email").value,
    document.getElementById("password").value
  );
}

// AUTH
auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("app").style.display = "block";
    if (!appStarted) {
      startApp();
      appStarted = true;
    }
  } else {
    document.getElementById("loginBox").style.display = "block";
    document.getElementById("app").style.display = "none";
  }
});

// START
function startApp() {

  const input = document.getElementById("scanInput");
  input.focus();

  input.addEventListener("input", () => {

    buffer = input.value;
    clearTimeout(timer);

    timer = setTimeout(() => {
      if (buffer.length > 10) processScan(buffer);
      input.value = "";
      buffer = "";
    }, 120);
  });

  db.ref("scans").on("value", snap => {

    const data = snap.val() || {};
    const summary = {};

    let total = 0;
    let totalWeight = 0;

    Object.values(data).forEach(i => {

      total++;
      totalWeight += i.weight;

      const key = i.gmid + "|" + i.batch;

      if (!summary[key]) {
        summary[key] = { gmid:i.gmid, batch:i.batch, qty:0, weight:0 };
      }

      summary[key].qty++;
      summary[key].weight += i.weight;
    });

    document.getElementById("totalCount").innerText = total;
    document.getElementById("totalWeight").innerText = totalWeight.toFixed(3);

    render(rawMode ? data : summary);
  });
}

// SCAN
function processScan(scan) {

  let gmid = "";
  let batch = "";
  let weight = 0;

  const parts = scan.split(";");

  for (let p of parts) {
    if (p.startsWith("0100")) gmid = p.slice(-7);
    else if (p.startsWith("10")) batch = p.substring(2);
    else if (p.startsWith("3103")) weight = parseInt(p.substring(4)) / 1000;
  }

  if (!gmid || !batch || !weight) {
    document.getElementById("status").innerText = "INVALID SCAN";
    return;
  }

  db.ref("scans").push({
    gmid,
    batch,
    weight,
    time: Date.now()
  }).then(ref => {
    lastScanKey = ref.key;
  });

  document.getElementById("status").innerText =
    `Loaded ${gmid} | ${batch} | ${weight}`;
}

// UNDO
function undoLast() {
  if (!lastScanKey) return;
  db.ref("scans/" + lastScanKey).remove();
  lastScanKey = null;
}

// RESET
function resetAll() {
  db.ref("scans").remove();
}

// TOGGLE VIEW
function toggleView() {
  rawMode = !rawMode;
}

// RENDER
function render(data) {

  const table = document.getElementById("table");
  table.innerHTML = "";

  if (rawMode) {

    Object.values(data).forEach(i => {
      const row = table.insertRow();
      row.insertCell(0).innerText = i.gmid;
      row.insertCell(1).innerText = i.batch;
      row.insertCell(2).innerText = 1;
      row.insertCell(3).innerText = i.weight;
    });

  } else {

    Object.values(data).forEach(i => {
      const row = table.insertRow();
      row.insertCell(0).innerText = i.gmid;
      row.insertCell(1).innerText = i.batch;
      row.insertCell(2).innerText = i.qty;
      row.insertCell(3).innerText = i.weight.toFixed(3);
    });
  }
}

// EXPORT EXCEL (PROMPTS ADDED HERE)
function exportExcel() {

  const trailer = prompt("Trailer Number:");
  const delivery = prompt("Delivery Number:");
  const shipment = prompt("Shipment Number:");
  const seal = prompt("Seal Number:");

  db.ref("scans").once("value").then(snap => {

    const data = snap.val() || {};
    const summary = {};

    Object.values(data).forEach(i => {

      const key = i.gmid + "|" + i.batch;

      if (!summary[key]) {
        summary[key] = { gmid:i.gmid, batch:i.batch, qty:0, weight:0 };
      }

      summary[key].qty++;
      summary[key].weight += i.weight;
    });

    const header = [
      ["TRAILER", trailer],
      ["DELIVERY", delivery],
      ["SHIPMENT", shipment],
      ["SEAL", seal],
      [""],
      ["GMID", "Batch", "Qty", "Weight"]
    ];

    const rows = Object.values(summary).map(i => [
      i.gmid,
      i.batch,
      i.qty,
      i.weight.toFixed(3)
    ]);

    const ws = XLSX.utils.aoa_to_sheet(header.concat(rows));
    const wb = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(wb, ws, "Load");

    XLSX.writeFile(wb, `LOAD_${trailer || "EXPORT"}.xlsx`);
  });
}

</script>

</body>
</html>
