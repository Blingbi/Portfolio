<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Warehouse Scan System</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #0b0f14;
  color: #d7e1ea;
  padding: 20px;
}

#app, #loginBox {
  background: #121a22;
  padding: 15px;
  border-radius: 8px;
  border: 1px solid #1f2a36;
}

input {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  margin: 6px 0;
  background: #0f151c;
  color: #d7e1ea;
  border: 1px solid #263241;
  border-radius: 5px;
}

button {
  padding: 10px;
  margin-top: 10px;
  cursor: pointer;
  background: #1f6feb;
  border: none;
  color: white;
  border-radius: 5px;
}

button:hover {
  background: #2b7fff;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
  background: #0f151c;
}

td, th {
  border: 1px solid #223040;
  padding: 8px;
}

th {
  background: #1a2430;
  color: #9fd3ff;
}

.status {
  margin-top: 10px;
  font-weight: bold;
  color: #7ee787;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <h2>Warehouse Login</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app">

<h2>Live Scan Terminal</h2>

<input id="scanInput" placeholder="Scan Data Matrix">

<button onclick="logout()">Logout</button>
<button onclick="exportCSV()">Export CSV</button>
<button onclick="resetAll()">Reset</button>
<button onclick="undoLast()">Undo Last Scan</button>

<div class="status">
  Total Scanned: <span id="totalCount">0</span>
</div>

<div class="status">
  Total Weight: <span id="totalWeight">0.000</span>
</div>

<div class="status" id="status"></div>

<table>
<thead>
<tr>
<th>GMID</th>
<th>Batch</th>
<th>Qty</th>
<th>Weight</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

<audio id="beepSound" src="beep.mp3" preload="auto"></audio>

</div>

<script>

// Firebase
const firebaseConfig = {
  apiKey: "AIzaSyCJFDM58excT8iD6guuJyQajLxxnFVsHEg",
  authDomain: "warehouse-scanner-1b6bc.firebaseapp.com",
  databaseURL: "https://warehouse-scanner-1b6bc-default-rtdb.firebaseio.com",
  projectId: "warehouse-scanner-1b6bc",
  storageBucket: "warehouse-scanner-1b6bc.appspot.com",
  messagingSenderId: "347483666604",
  appId: "1:347483666604:web:cc30686d262c0e3376c709"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let buffer = "";
let timer = null;
let appStarted = false;

let lastScanKey = null;

// 🔊 BEEP
function playBeep() {
  const beep = document.getElementById("beepSound");
  beep.volume = 1;
  beep.currentTime = 0;
  beep.play().catch(() => {});
}

// LOGIN
function login() {
  auth.signInWithEmailAndPassword(
    document.getElementById("email").value,
    document.getElementById("password").value
  );
}

function logout() {
  auth.signOut();
}

// AUTH
auth.onAuthStateChanged(user => {

  if (user) {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("app").style.display = "block";

    if (!appStarted) {
      startApp();
      appStarted = true;
    }

  } else {
    document.getElementById("loginBox").style.display = "block";
    document.getElementById("app").style.display = "none";
  }
});

// START
function startApp() {

  const input = document.getElementById("scanInput");

  input.focus();

  input.addEventListener("input", () => {

    buffer = input.value;
    clearTimeout(timer);

    timer = setTimeout(() => {
      if (buffer.length > 10) processScan(buffer);
      input.value = "";
      buffer = "";
    }, 120);
  });

  db.ref("scans").on("value", snap => {

    const data = snap.val() || {};
    const summary = {};

    let total = 0;
    let totalWeight = 0;

    Object.values(data).forEach(i => {

      const key = i.gmid + "|" + i.batch;

      if (!summary[key]) {
        summary[key] = { gmid:i.gmid, batch:i.batch, qty:0, weight:0 };
      }

      summary[key].qty++;
      summary[key].weight += i.weight;

      total++;
      totalWeight += i.weight;
    });

    render(summary);

    document.getElementById("totalCount").innerText = total;
    document.getElementById("totalWeight").innerText = totalWeight.toFixed(3);
  });
}

// SCAN
function processScan(scan) {

  let gmid = "";
  let batch = "";
  let weight = 0;

  const parts = scan.split(";");

  for (let p of parts) {
    if (p.startsWith("0100")) gmid = p.slice(-7);
    else if (p.startsWith("10")) batch = p.substring(2);
    else if (p.startsWith("3103")) weight = parseInt(p.substring(4)) / 1000;
  }

  if (!gmid || !batch || !weight) {
    document.getElementById("status").innerText = "INVALID SCAN";
    return;
  }

  db.ref("scans").push({
    gmid,
    batch,
    weight,
    time: Date.now()
  })
  .then(ref => {
    lastScanKey = ref.key;
    playBeep();
  });

  document.getElementById("status").innerText =
    `Loaded ${gmid} | ${batch} | ${weight}`;
}

// UNDO LAST
function undoLast() {

  if (!lastScanKey) return;

  db.ref("scans/" + lastScanKey).remove();
  lastScanKey = null;
}

// RESET
function resetAll() {
  db.ref("scans").remove();
}

// EXPORT
function exportCSV() {

  db.ref("scans").once("value").then(snap => {

    const data = snap.val() || {};
    const summary = {};

    Object.values(data).forEach(i => {

      const key = i.gmid + "|" + i.batch;

      if (!summary[key]) {
        summary[key] = { gmid:i.gmid, batch:i.batch, qty:0, weight:0 };
      }

      summary[key].qty++;
      summary[key].weight += i.weight;
    });

    let csv = "GMID,Batch,Qty,Weight\n";

    Object.values(summary).forEach(i => {
      csv += `${i.gmid},${i.batch},${i.qty},${i.weight.toFixed(3)}\n`;
    });

    const blob = new Blob([csv], {type:"text/csv"});
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "warehouse.csv";
    a.click();
  });
}

</script>

</body>
</html>
