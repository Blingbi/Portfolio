<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Warehouse Scan System</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0b0f14;color:#d7e1ea;}
#nav{display:flex;background:#121a22;border-bottom:1px solid #1f2a36;padding:10px;gap:10px;flex-wrap:wrap;}
.navItem{padding:8px 12px;cursor:pointer;border-radius:6px;background:#1a2430;}
.navItem.active{background:#1f6feb;}
.container{padding:20px;max-width:1200px;margin:auto;}
.card{background:#121a22;padding:15px;border-radius:8px;border:1px solid #1f2a36;}
input,select,textarea{width:100%;padding:10px;margin:5px 0;background:#0f151c;color:white;border:1px solid #263241;box-sizing:border-box;}
button{padding:10px;margin-top:8px;background:#1f6feb;border:none;color:white;cursor:pointer;border-radius:6px;margin-right:5px;}
.status{margin-top:10px;color:#7ee787;font-weight:bold;}
.error{color:#ff6b6b;}
table{width:100%;border-collapse:collapse;margin-top:15px;table-layout:fixed;}
th,td{border:1px solid #223040;padding:10px;word-wrap:break-word;}
th{background:#1a2430;color:#9fd3ff;}
.hidden{display:none;}
.mobileBox{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;}
.bigLabel{font-size:26px;opacity:0.8;margin-top:20px;}
.bigNumber{font-size:70px;font-weight:900;margin:10px 0;}
#mobileScan{position:absolute;top:-1000px;}
</style>
</head>

<body>

<div id="nav">
  <div class="navItem active" onclick="showPage('scanner')">Scanner</div>
  <div class="navItem" onclick="showPage('rules')">Rules</div>
  <div class="navItem" onclick="showPage('mobile')">Mobile</div>
  <div class="navItem" onclick="showPage('mb52')">MB52 Scanner</div>
</div>

<div class="container">

<div id="scannerPage">
<div class="card">
<select id="destinationSelect">
  <option value="">No Destination / Unassigned</option>
  <option value="CENTRAL">Central</option>
  <option value="CDW">CDW</option>
  <option value="INTERPLANT">Interplant</option>
  <option value="KVILLE">Kville</option>
</select>

<input id="scanInput" placeholder="Scan Data Matrix">

<button onclick="toggleRules()" id="rulesToggleBtn">Rules: ON</button>
<button onclick="exportExcel()">Export Excel</button>
<button onclick="resetAll()">Reset All</button>

<div class="status">Rules Status: <span id="rulesStatus">ENABLED</span></div>
<div class="status">Total Scanned: <span id="totalCount">0</span></div>
<div class="status">Total Weight: <span id="totalWeight">0.000</span></div>

<table>
<thead>
<tr>
<th>GMID</th>
<th>Batch</th>
<th>Destination</th>
<th>Qty</th>
<th>Total Weight</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

<div id="status" class="status"></div>
</div>
</div>

<div id="rulesPage" class="hidden">
<div class="card">
<h3>Rules</h3>

<input id="ruleSearch" placeholder="Search GMID or Destination..." oninput="renderRules()">

<select id="ruleDestination">
  <option value="">Select Destination</option>
  <option value="CENTRAL">Central</option>
  <option value="CDW">CDW</option>
  <option value="INTERPLANT">Interplant</option>
  <option value="KVILLE">Kville</option>
</select>

<input id="ruleGMID" placeholder="GMID">
<button onclick="addRule()">Add Rule</button>

<table>
<thead>
<tr>
<th>Destination</th>
<th>GMID</th>
<th>Delete</th>
</tr>
</thead>
<tbody id="rulesTable"></tbody>
</table>
</div>
</div>

<div id="mobilePage" class="hidden">
<div class="mobileBox">
<div class="bigLabel">TOTAL SCANNED</div>
<div class="bigNumber" id="mTotal">0</div>
<div class="bigLabel">LAST SCAN</div>
<div class="bigNumber" id="lastScan">None</div>
<input id="mobileScan" autocomplete="off">
</div>
</div>

<div id="mb52Page" class="hidden">
<div class="card">
<h3>MB52 Validation Scanner</h3>

<textarea id="mb52Input" style="height:250px;" placeholder="Paste MB52 report here"></textarea>

<button onclick="loadMB52()">Load MB52</button>
<button onclick="clearMB52()">Clear MB52 List</button>
<button onclick="exportMB52()">Export MB52 Excel</button>
<button onclick="resetMB52()">Reset MB52 Scans</button>

<select id="mb52Mode">
  <option value="UNRESTRICTED">Unrestricted Only</option>
  <option value="UNRESTRICTED_QUALITY">Unrestricted + Quality</option>
</select>

<input id="mb52ScanInput" placeholder="Scan Data Matrix">

<div class="status">Loaded Batches: <span id="mb52Count">0</span></div>
<div class="status">Total MB52 Scans: <span id="mb52ScanCount">0</span></div>

<table>
<thead>
<tr>
<th>GMID</th>
<th>Batch</th>
<th>Status</th>
<th>Qty</th>
<th>Total Weight</th>
</tr>
</thead>
<tbody id="mb52Table"></tbody>
</table>

<div id="mb52Status" class="status"></div>
</div>
</div>

</div>

<script>
/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyCJFDM58excT8iD6guuJyQajLxxnFVsHEg",
  authDomain: "warehouse-scanner-1b6bc.firebaseapp.com",
  databaseURL: "https://warehouse-scanner-1b6bc-default-rtdb.firebaseio.com",
  projectId: "warehouse-scanner-1b6bc"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* SOUND */
/* SOUND */
const successBeep = new Audio("./Beep.mp3");
const errorBeep = new Audio("./ErrorBeep.mp3");

successBeep.preload = "auto";
errorBeep.preload = "auto";

successBeep.load();
errorBeep.load();

function playSound(audio){
  audio.pause();
  audio.currentTime = 0;

  audio.play().catch(err=>{
    console.log("Sound failed:", err);

    audio.load();

    setTimeout(()=>{
      audio.currentTime = 0;
      audio.play().catch(e=>console.log("Retry failed:", e));
    },50);
  });
}

function playSuccess(){
  playSound(successBeep);
}

function playErrorSound(){
  playSound(errorBeep);
}

/* STATE */
let allRulesCache = {};
let rulesEnabled = true;
let allowedBatches = {};
let mb52Scans = [];
let scanTimer = null;
let mobileTimer = null;
let mb52Timer = null;

/* HELPERS */
function setStatus(id,msg,isError=false){
  const el = document.getElementById(id);
  if(!el) return;
  el.innerText = msg;
  el.style.color = isError ? "#ff6b6b" : "#7ee787";
}

function playError(msg){
  playErrorSound();
  setStatus("status", msg, true);
  setStatus("mb52Status", msg, true);
}

function parseBarcode(raw){
  let gmid = "";
  let batch = "";
  let weight = 0;

  raw.split(";").forEach(part=>{
    const p = part.trim();

    if(p.startsWith("0100")){
      gmid = p.slice(-7);
    }

    if(p.startsWith("10") && !p.startsWith("100")){
      batch = p.slice(2);
    }

    if(p.startsWith("3103")){
      weight = parseInt(p.slice(4),10) / 1000;
    }
  });

  return { gmid, batch, weight };
}

function handleScanInput(inputEl, callback, timerName){
  const raw = inputEl.value;

  if(timerName === "scan") clearTimeout(scanTimer);
  if(timerName === "mobile") clearTimeout(mobileTimer);
  if(timerName === "mb52") clearTimeout(mb52Timer);

  const run = setTimeout(()=>{
    if(raw.trim().length > 0){
      callback(raw.trim());
    }

    inputEl.value = "";
    inputEl.focus();
  },100);

  if(timerName === "scan") scanTimer = run;
  if(timerName === "mobile") mobileTimer = run;
  if(timerName === "mb52") mb52Timer = run;
}

/* NAV */
function showPage(page){
  document.getElementById("scannerPage").classList.add("hidden");
  document.getElementById("rulesPage").classList.add("hidden");
  document.getElementById("mobilePage").classList.add("hidden");
  document.getElementById("mb52Page").classList.add("hidden");

  document.querySelectorAll(".navItem").forEach(i=>i.classList.remove("active"));

  if(page === "scanner"){
    document.getElementById("scannerPage").classList.remove("hidden");
    document.querySelectorAll(".navItem")[0].classList.add("active");
    setTimeout(()=>document.getElementById("scanInput").focus(),100);
  }

  if(page === "rules"){
    document.getElementById("rulesPage").classList.remove("hidden");
    document.querySelectorAll(".navItem")[1].classList.add("active");
  }

  if(page === "mobile"){
    document.getElementById("mobilePage").classList.remove("hidden");
    document.querySelectorAll(".navItem")[2].classList.add("active");
    setTimeout(()=>document.getElementById("mobileScan").focus(),100);
  }

  if(page === "mb52"){
    document.getElementById("mb52Page").classList.remove("hidden");
    document.querySelectorAll(".navItem")[3].classList.add("active");
    setTimeout(()=>document.getElementById("mb52ScanInput").focus(),100);
  }
}

/* START */
function start(){
  document.getElementById("scanInput").addEventListener("input", e=>{
    handleScanInput(e.target, scan, "scan");
  });

  document.getElementById("mobileScan").addEventListener("input", e=>{
    handleScanInput(e.target, scan, "mobile");
  });

  document.getElementById("mb52ScanInput").addEventListener("input", e=>{
    handleScanInput(e.target, scanMB52, "mb52");
  });

  loadRules();
  listenScans();
  listenMB52();
  listenMB52Scans();

  setTimeout(()=>document.getElementById("scanInput").focus(),100);
}

/* NORMAL SCANNER */
function scan(raw){
  const p = parseBarcode(raw);

  if(!p.gmid || !p.batch || !p.weight){
    playError("INVALID BARCODE");
    return;
  }

  const dest = document.getElementById("destinationSelect").value || "UNASSIGNED";

  if(rulesEnabled && allRulesCache){
    for(const d in allRulesCache){
      if(allRulesCache[d] && allRulesCache[d][p.gmid]){
        if(d !== dest){
          playError("RULE VIOLATION: " + p.gmid + " must go to " + d);
          return;
        }
      }
    }
  }

  db.ref("scans").push({
    gmid:p.gmid,
    batch:p.batch,
    weight:p.weight,
    dest:dest,
    time:Date.now()
  }).then(()=>{
    playSuccess();
    setStatus("status","Scan added");
  }).catch(err=>{
    console.log(err);
    playError("SCAN FAILED");
  });
}

function listenScans(){
  db.ref("scans").on("value", snap=>{
    const data = snap.val() || {};
    const summary = {};
    let total = 0;
    let weight = 0;
    let last = "None";

    Object.values(data).forEach(i=>{
      total++;
      weight += Number(i.weight || 0);
      last = `${i.gmid} | ${i.batch}`;

      const key = `${i.gmid}|${i.batch}|${i.dest || "UNASSIGNED"}`;

      if(!summary[key]){
        summary[key] = {
          gmid:i.gmid,
          batch:i.batch,
          dest:i.dest || "UNASSIGNED",
          qty:0,
          weight:0
        };
      }

      summary[key].qty++;
      summary[key].weight += Number(i.weight || 0);
    });

    document.getElementById("totalCount").innerText = total;
    document.getElementById("totalWeight").innerText = weight.toFixed(3);
    document.getElementById("mTotal").innerText = total;
    document.getElementById("lastScan").innerText = last;

    renderMainTable(summary);
  });
}

function renderMainTable(summary){
  const t = document.getElementById("table");
  t.innerHTML = "";

  Object.values(summary).forEach(i=>{
    const r = t.insertRow();
    r.insertCell(0).innerText = i.gmid;
    r.insertCell(1).innerText = i.batch;
    r.insertCell(2).innerText = i.dest;
    r.insertCell(3).innerText = i.qty;
    r.insertCell(4).innerText = i.weight.toFixed(3);
  });
}

function resetAll(){
  if(!confirm("Clear ALL normal scans?")) return;

  db.ref("scans").remove().then(()=>{
    setStatus("status","All scans cleared");
  }).catch(err=>{
    console.log(err);
    playError("RESET FAILED");
  });
}

function exportExcel(){
  db.ref("scans").once("value").then(snap=>{
    const data = snap.val() || {};
    const summary = {};

    Object.values(data).forEach(i=>{
      const key = `${i.gmid}|${i.batch}|${i.dest || "UNASSIGNED"}`;

      if(!summary[key]){
        summary[key] = {
          GMID:i.gmid,
          Batch:i.batch,
          Destination:i.dest || "UNASSIGNED",
          Qty:0,
          Weight:0
        };
      }

      summary[key].Qty++;
      summary[key].Weight += Number(i.weight || 0);
    });

    const rows = Object.values(summary).map(i=>({
      GMID:i.GMID,
      Batch:i.Batch,
      Destination:i.Destination,
      Qty:i.Qty,
      Weight:Number(i.Weight.toFixed(3))
    }));

    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(wb, ws, "Warehouse");
    XLSX.writeFile(wb, "warehouse_export.xlsx");
  });
}

/* RULES */
function toggleRules(){
  rulesEnabled = !rulesEnabled;

  document.getElementById("rulesToggleBtn").innerText = rulesEnabled ? "Rules: ON" : "Rules: OFF";
  document.getElementById("rulesStatus").innerText = rulesEnabled ? "ENABLED" : "DISABLED";
  document.getElementById("rulesStatus").style.color = rulesEnabled ? "#7ee787" : "#ff6b6b";
}

function addRule(){
  const dest = document.getElementById("ruleDestination").value;
  const gmid = document.getElementById("ruleGMID").value.trim();

  if(!dest || !gmid) return;

  db.ref("rules/" + dest + "/" + gmid).set(true).then(()=>{
    document.getElementById("ruleGMID").value = "";
  });
}

function loadRules(){
  db.ref("rules").on("value", snap=>{
    allRulesCache = snap.val() || {};
    renderRules();
  });
}

function renderRules(){
  const t = document.getElementById("rulesTable");
  const search = (document.getElementById("ruleSearch").value || "").toLowerCase();

  t.innerHTML = "";

  Object.keys(allRulesCache).forEach(dest=>{
    Object.keys(allRulesCache[dest]).forEach(gmid=>{
      if(!dest.toLowerCase().includes(search) && !gmid.toLowerCase().includes(search)) return;

      const r = t.insertRow();
      r.insertCell(0).innerText = dest;
      r.insertCell(1).innerText = gmid;

      const c = r.insertCell(2);
      const btn = document.createElement("button");

      btn.innerText = "Delete";
      btn.onclick = ()=>db.ref("rules/" + dest + "/" + gmid).remove();

      c.appendChild(btn);
    });
  });
}

/* MB52 */
function listenMB52(){
  db.ref("mb52").on("value", snap=>{
    allowedBatches = snap.val() || {};
    document.getElementById("mb52Count").innerText = Object.keys(allowedBatches).length;
  });
}

function listenMB52Scans(){
  db.ref("mb52Scans").on("value", snap=>{
    const data = snap.val() || {};
    mb52Scans = Object.values(data);
    renderMB52();
  });
}

function loadMB52(){
  const text = document.getElementById("mb52Input").value;
  const lines = text.split("\n");

  allowedBatches = {};
  let currentMaterial = "";

  lines.forEach(line=>{
    const materialMatch = line.match(/\|(\d{11})\s+/);

    if(materialMatch){
      currentMaterial = materialMatch[1];
      return;
    }

    const batchMatch = line.match(/\|207N\s+([A-Z0-9]+)\s+([\d,\.]+)\s+KG\s+([\d,\.]+)\s+([\d,\.]+)/);

    if(!batchMatch) return;

    const batch = batchMatch[1];
    const unrestricted = parseFloat(batchMatch[2].replace(/,/g,"")) || 0;
    const quality = parseFloat(batchMatch[3].replace(/,/g,"")) || 0;
    const blocked = parseFloat(batchMatch[4].replace(/,/g,"")) || 0;

    let status = "NONE";

    if(blocked > 0) status = "BLOCKED";
    else if(unrestricted > 0) status = "UNRESTRICTED";
    else if(quality > 0) status = "QUALITY";

    allowedBatches[batch] = {
      material:currentMaterial,
      status:status
    };
  });

  db.ref("mb52").set(allowedBatches).then(()=>{
    setStatus("mb52Status","MB52 Loaded & Synced");
  }).catch(err=>{
    console.log(err);
    playError("MB52 LOAD FAILED");
  });
}

function scanMB52(raw){
  const p = parseBarcode(raw);

  if(!p.gmid || !p.batch || !p.weight){
    playError("INVALID BARCODE");
    return;
  }

  if(!allowedBatches[p.batch]){
    playError("BATCH NOT IN MB52");
    return;
  }

  const batchInfo = allowedBatches[p.batch];

  if(batchInfo.status === "BLOCKED"){
    playError("BLOCKED INVENTORY");
    return;
  }

  if(document.getElementById("mb52Mode").value === "UNRESTRICTED" && batchInfo.status === "QUALITY"){
    playError("QUALITY STOCK NOT ALLOWED");
    return;
  }

  db.ref("mb52Scans").push({
    gmid:p.gmid,
    batch:p.batch,
    status:batchInfo.status,
    weight:p.weight,
    time:Date.now()
  }).then(()=>{
    playSuccess();
    setStatus("mb52Status","MB52 scan added");
  }).catch(err=>{
    console.log(err);
    playError("MB52 SCAN FAILED");
  });
}

function renderMB52(){
  const t = document.getElementById("mb52Table");
  t.innerHTML = "";

  const summary = {};

  mb52Scans.forEach(i=>{
    const key = `${i.gmid}|${i.batch}|${i.status}`;

    if(!summary[key]){
      summary[key] = {
        gmid:i.gmid,
        batch:i.batch,
        status:i.status,
        qty:0,
        weight:0
      };
    }

    summary[key].qty++;
    summary[key].weight += Number(i.weight || 0);
  });

  document.getElementById("mb52ScanCount").innerText = mb52Scans.length;

  Object.values(summary)
    .sort((a,b)=>a.batch.localeCompare(b.batch) || a.gmid.localeCompare(b.gmid))
    .forEach(i=>{
      const r = t.insertRow();
      r.insertCell(0).innerText = i.gmid;
      r.insertCell(1).innerText = i.batch;
      r.insertCell(2).innerText = i.status;
      r.insertCell(3).innerText = i.qty;
      r.insertCell(4).innerText = i.weight.toFixed(3);
    });
}

function exportMB52(){
  const summary = {};

  mb52Scans.forEach(i=>{
    const key = `${i.gmid}|${i.batch}|${i.status}`;

    if(!summary[key]){
      summary[key] = {
        GMID:i.gmid,
        Batch:i.batch,
        Status:i.status,
        Qty:0,
        Weight:0
      };
    }

    summary[key].Qty++;
    summary[key].Weight += Number(i.weight || 0);
  });

  const rows = Object.values(summary)
    .sort((a,b)=>a.Batch.localeCompare(b.Batch) || a.GMID.localeCompare(b.GMID))
    .map(i=>({
      GMID:i.GMID,
      Batch:i.Batch,
      Status:i.Status,
      Qty:i.Qty,
      Weight:Number(i.Weight.toFixed(3))
    }));

  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(wb, ws, "MB52 Scans");
  XLSX.writeFile(wb, "mb52_scans.xlsx");
}

function resetMB52(){
  if(!confirm("Clear MB52 scanned records for ALL scanners?")) return;

  db.ref("mb52Scans").remove().then(()=>{
    setStatus("mb52Status","MB52 scans cleared");
  }).catch(err=>{
    console.log(err);
    playError("MB52 RESET FAILED");
  });
}

function clearMB52(){
  if(!confirm("Clear MB52 loaded batch list for ALL scanners?")) return;

  db.ref("mb52").remove().then(()=>{
    setStatus("mb52Status","MB52 list cleared");
  }).catch(err=>{
    console.log(err);
    playError("MB52 CLEAR FAILED");
  });
}

start();
</script>

</body>
</html>
