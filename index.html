<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Warehouse Scan System</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#0b0f14;
  color:#d7e1ea;
}

#nav{
  display:flex;
  background:#121a22;
  padding:10px;
  gap:10px;
  border-bottom:1px solid #1f2a36;
}

.navItem{
  padding:8px 12px;
  background:#1a2430;
  border-radius:6px;
  cursor:pointer;
}

.navItem.active{background:#1f6feb;}

.container{padding:20px}

.hidden{display:none}

input,select{
  width:100%;
  padding:10px;
  margin:5px 0;
  background:#0f151c;
  color:white;
  border:1px solid #263241;
  box-sizing:border-box;
}

button{
  padding:10px;
  margin-top:8px;
  background:#1f6feb;
  border:none;
  color:white;
  border-radius:6px;
}

.status{color:#7ee787;margin-top:10px}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,td{
  border:1px solid #223040;
  padding:8px;
}

/* IMPORTANT: prevents keyboard focus behavior */
input[readonly]{
  caret-color: transparent;
}

#gunScan, #mobileGun{
  position:absolute;
  left:-9999px;
}

.mobileBox{
  text-align:center;
  padding:20px;
}

.big{
  font-size:80px;
  font-weight:900;
}

</style>
</head>

<body>

<!-- NAV -->
<div id="nav">
  <div class="navItem" onclick="show('scanner')">Scanner</div>
  <div class="navItem" onclick="show('mobile')">Mobile</div>
</div>

<div class="container">

<!-- SCANNER -->
<div id="scanner">

<select id="dest">
  <option value="">Optional Destination</option>
  <option>Central</option>
  <option>CDW</option>
  <option>Interplant</option>
  <option>Kville</option>
</select>

<!-- READONLY = NO KEYBOARD -->
<input id="gunScan" readonly>

<div class="big" id="total">0</div>
<div class="status">TOTAL SCANNED</div>

</div>

<!-- MOBILE -->
<div id="mobile" class="hidden">

<div class="big" id="mTotal">0</div>
<div class="status">MOBILE TOTAL</div>

<!-- READONLY = NO KEYBOARD -->
<input id="mobileGun" readonly>

</div>

</div>

<script>

const db = firebase.initializeApp({
  databaseURL:"https://warehouse-scanner-1b6bc-default-rtdb.firebaseio.com"
}).database();

let buffer1="", buffer2="";
let timer1, timer2;

let lastKey="";
let lastTime=0;

/* NAV */
function show(page){

  document.getElementById("scanner").classList.add("hidden");
  document.getElementById("mobile").classList.add("hidden");

  document.getElementById(page).classList.remove("hidden");
}

/* CORE SCAN */
function processScan(raw){

  let g="",b="",w=0;

  for(let p of raw.split(";")){
    if(p.startsWith("0100")) g=p.slice(-7);
    if(p.startsWith("10")) b=p.slice(2);
    if(p.startsWith("3103")) w=parseInt(p.slice(4))/1000;
  }

  if(!g||!b||!w) return;

  let key=g+"|"+b;
  let now=Date.now();

  if(key===lastKey && now-lastTime<900) return;

  lastKey=key;
  lastTime=now;

  db.ref("scans").push({
    gmid:g,
    batch:b,
    weight:w,
    dest:document.getElementById("dest").value||"UNASSIGNED",
    time:now
  });
}

/* SCANNER INPUT */
document.getElementById("gunScan").addEventListener("input",e=>{
  buffer1=e.target.value;
  clearTimeout(timer1);

  timer1=setTimeout(()=>{
    processScan(buffer1);
    e.target.value="";

    // IMPORTANT: prevents keyboard popup loop
    e.target.blur();
  },50);
});

/* MOBILE INPUT */
document.getElementById("mobileGun").addEventListener("input",e=>{
  buffer2=e.target.value;
  clearTimeout(timer2);

  timer2=setTimeout(()=>{
    processScan(buffer2);
    e.target.value="";

    // IMPORTANT: prevents keyboard popup loop
    e.target.blur();
  },50);
});

/* LIVE TOTALS */
db.ref("scans").on("value",snap=>{
  let data=snap.val()||{};
  let c=0;

  Object.values(data).forEach(()=>c++);

  document.getElementById("total").innerText=c;
  document.getElementById("mTotal").innerText=c;
});

</script>

</body>
</html>
