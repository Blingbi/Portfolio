<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Warehouse Scan System</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@18.5/dist/xlsx.full.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0b0f14;color:#d7e1ea}
#nav{display:flex;background:#121a22;padding:10px;gap:10px}
.navItem{padding:8px 12px;background:#1a2430;cursor:pointer;border-radius:6px}
.navItem.active{background:#1f6feb}
.container{padding:20px}

.hidden{display:none}

input,select{width:100%;padding:10px;margin:5px 0}

#gunScan,#mobileGun{
  position:absolute;
  left:-9999px;
}

.big{
  font-size:90px;
  font-weight:900;
  text-align:center;
}

.small{
  text-align:center;
  opacity:0.7;
}
</style>
</head>

<body>

<div id="nav">
  <div class="navItem" onclick="show('scanner')">Scanner</div>
  <div class="navItem" onclick="show('mobile')">Mobile</div>
</div>

<div class="container">

<!-- SCANNER -->
<div id="scanner">

<select id="dest">
  <option value="">Optional Destination</option>
  <option>Central</option>
  <option>CDW</option>
  <option>Interplant</option>
  <option>Kville</option>
</select>

<input id="gunScan">

<div class="big" id="total">0</div>
<div class="small">TOTAL SCANNED</div>

</div>

<!-- MOBILE -->
<div id="mobile" class="hidden">

<div class="big" id="mTotal">0</div>
<div class="small">MOBILE TOTAL</div>

<input id="mobileGun">

</div>

</div>

<script>

const db = firebase.initializeApp({
  databaseURL:"https://warehouse-scanner-1b6bc-default-rtdb.firebaseio.com"
}).database();

let scanLock = {key:"",time:0};

/* NAV */
function show(page){
  document.getElementById("scanner").classList.add("hidden");
  document.getElementById("mobile").classList.add("hidden");

  document.getElementById(page).classList.remove("hidden");

  setTimeout(()=>{
    if(page==="scanner") document.getElementById("gunScan").focus();
    if(page==="mobile") document.getElementById("mobileGun").focus();
  },150);
}

/* CORE SCAN */
function handleScan(raw){

  let g="",b="",w=0;

  for(let p of raw.split(";")){
    if(p.startsWith("0100")) g=p.slice(-7);
    if(p.startsWith("10")) b=p.slice(2);
    if(p.startsWith("3103")) w=parseInt(p.slice(4))/1000;
  }

  if(!g||!b||!w) return;

  let key=g+"|"+b;
  let now=Date.now();

  if(scanLock.key===key && now-scanLock.time<900) return;

  scanLock={key,time:now};

  db.ref("scans").push({
    gmid:g,
    batch:b,
    weight:w,
    dest:document.getElementById("dest")?.value||"UNASSIGNED",
    time:now
  });
}

/* SCANNER INPUT */
let b1="",t1;
document.getElementById("gunScan").addEventListener("input",e=>{
  b1=e.target.value;
  clearTimeout(t1);

  t1=setTimeout(()=>{
    handleScan(b1);
    e.target.value="";
  },60);
});

/* MOBILE INPUT (SEPARATE BUFFER — THIS IS THE FIX) */
let b2="",t2;
document.getElementById("mobileGun").addEventListener("input",e=>{
  b2=e.target.value;
  clearTimeout(t2);

  t2=setTimeout(()=>{
    handleScan(b2);
    e.target.value="";
  },60);
});

/* LIVE TOTALS */
db.ref("scans").on("value",snap=>{
  let d=snap.val()||{};
  let c=0;

  Object.values(d).forEach(()=>c++);

  document.getElementById("total").innerText=c;
  document.getElementById("mTotal").innerText=c;
});

</script>

</body>
</html>
