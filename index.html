<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trailer Scan System</title>

<style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background-color: #f5f5f5;
    }

    h1 {
        margin-bottom: 15px;
    }

    input {
        width: 100%;
        padding: 15px;
        font-size: 22px;
        box-sizing: border-box;
        margin-bottom: 15px;
    }

    button {
        padding: 12px 18px;
        font-size: 16px;
        margin-right: 10px;
        cursor: pointer;
        margin-bottom: 10px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        margin-top: 20px;
    }

    th, td {
        border: 1px solid #ccc;
        padding: 10px;
        text-align: left;
    }

    th {
        background-color: #eaeaea;
    }

    .status {
        margin-top: 10px;
        font-weight: bold;
    }
</style>
</head>

<body>

<h1>Trailer Scan System</h1>

<label><strong>Scan Data Matrix</strong></label>
<input type="text" id="scanInput" autofocus placeholder="Scan barcode here">

<br>

<button onclick="exportCSV()">Export Summary CSV</button>
<button onclick="resetData()">RESET ALL DATA</button>

<div class="status" id="status"></div>

<table>
    <thead>
        <tr>
            <th>GMID</th>
            <th>Batch</th>
            <th>Drum Qty</th>
            <th>Total Weight</th>
        </tr>
    </thead>
    <tbody id="summaryTable"></tbody>
</table>

<script>

const scanInput = document.getElementById("scanInput");
const summaryTable = document.getElementById("summaryTable");
const statusDiv = document.getElementById("status");

let data = {};

// ------------------------------
// SCAN BUFFER (IMPORTANT FIX)
// ------------------------------
let scanBuffer = "";
let scanTimer = null;

scanInput.addEventListener("input", function () {

    scanBuffer = scanInput.value;

    clearTimeout(scanTimer);

    scanTimer = setTimeout(() => {

        if (scanBuffer && scanBuffer.length > 10) {
            processScan(scanBuffer.trim());
        }

        scanInput.value = "";
        scanBuffer = "";

    }, 120); // small delay to collect full scan
});

// ------------------------------
// MAIN PARSER
// ------------------------------
function processScan(scan) {

    let gmid = "";
    let batch = "";
    let weight = 0;

    /*
      YOUR REAL FORMAT:
      ~LBL;010004133965;10H052PB4104;3103227000;11;17

      WE NEED:
      GMID = 4133965
      BATCH = H052PB4104
      WEIGHT = 227.000
    */

    const parts = scan.split(";");

    for (let part of parts) {

        // GMID (0100 + 7-digit embedded)
        if (part.startsWith("0100")) {
            gmid = part.slice(-7);
        }

        // Batch (10 + code)
        else if (part.startsWith("10") && part.length > 2) {
            batch = part.substring(2);
        }

        // Weight (GS1 3103 format)
        else if (part.startsWith("3103")) {

            let raw = part.substring(4);

            weight = parseInt(raw) / 1000;
        }
    }

    if (!gmid || !batch || !weight) {
        statusDiv.innerText = "❌ Parse failed - check barcode format";
        return;
    }

    const key = gmid + "|" + batch;

    if (!data[key]) {
        data[key] = {
            gmid,
            batch,
            qty: 0,
            totalWeight: 0
        };
    }

    data[key].qty += 1;
    data[key].totalWeight += weight;

    renderSummary();

    statusDiv.innerText =
        `✔ GMID ${gmid} | Batch ${batch} | Weight ${weight.toFixed(3)}`;
}

// ------------------------------
// SUMMARY TABLE
// ------------------------------
function renderSummary() {

    summaryTable.innerHTML = "";

    for (let key in data) {

        let item = data[key];

        const row = summaryTable.insertRow();

        row.insertCell(0).innerText = item.gmid;
        row.insertCell(1).innerText = item.batch;
        row.insertCell(2).innerText = item.qty;
        row.insertCell(3).innerText = item.totalWeight.toFixed(3);
    }
}

// ------------------------------
// EXPORT ONLY SUMMARY
// ------------------------------
function exportCSV() {

    let csv = "GMID,Batch,DrumQty,TotalWeight\n";

    for (let key in data) {

        let item = data[key];

        csv += `${item.gmid},${item.batch},${item.qty},${item.totalWeight.toFixed(3)}\n`;
    }

    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "trailer_summary.csv";
    a.click();
}

// ------------------------------
// RESET BUTTON
// ------------------------------
function resetData() {

    if (confirm("Clear all scanned data?")) {

        data = {};

        summaryTable.innerHTML = "";

        statusDiv.innerText = "✔ Reset complete";
    }
}

</script>

</body>
</html>
