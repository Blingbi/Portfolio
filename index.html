<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Warehouse Scan System</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

<style>
body { font-family: Arial; padding:20px; background:#f5f5f5; }

#app { display:none; }

input {
  width:100%;
  padding:12px;
  font-size:18px;
  margin:5px 0;
}

button {
  padding:10px;
  margin-top:10px;
  cursor:pointer;
}

table {
  width:100%;
  background:white;
  border-collapse:collapse;
  margin-top:15px;
}

td,th {
  border:1px solid #ccc;
  padding:8px;
}

.status { margin-top:10px; font-weight:bold; }
</style>
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="loginBox">
  <h2>Warehouse Login</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <div id="loginStatus"></div>
</div>

<!-- APP -->
<div id="app">

<h2>Live Scan System</h2>

<input id="scanInput" placeholder="Scan Data Matrix">

<button onclick="logout()">Logout</button>
<button onclick="exportCSV()">Export CSV</button>
<button onclick="resetAll()">Reset</button>

<div class="status" id="status"></div>

<table>
<thead>
<tr>
<th>GMID</th>
<th>Batch</th>
<th>Qty</th>
<th>Weight</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

</div>

<script>

// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyCJFDM58excT8iD6guuJyQajLxxnFVsHEg",
  authDomain: "warehouse-scanner-1b6bc.firebaseapp.com",
  databaseURL: "https://warehouse-scanner-1b6bc-default-rtdb.firebaseio.com",
  projectId: "warehouse-scanner-1b6bc",
  storageBucket: "warehouse-scanner-1b6bc.appspot.com",
  messagingSenderId: "347483666604",
  appId: "1:347483666604:web:cc30686d262c0e3376c709"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let buffer = "";
let timer = null;

// LOGIN
function login() {

  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, pass)
    .then(() => {})
    .catch(err => {
      document.getElementById("loginStatus").innerText = err.message;
    });
}

function logout() {
  auth.signOut();
}

// AUTH STATE
auth.onAuthStateChanged(user => {

  if (user) {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("app").style.display = "block";
    startApp();
  } else {
    document.getElementById("loginBox").style.display = "block";
    document.getElementById("app").style.display = "none";
  }
});

// APP START
function startApp() {

  const input = document.getElementById("scanInput");

  input.addEventListener("input", () => {

    buffer = input.value;

    clearTimeout(timer);

    timer = setTimeout(() => {
      if (buffer.length > 10) processScan(buffer);
      input.value = "";
      buffer = "";
    }, 120);
  });

  db.ref("scans").on("value", snap => {

    const data = snap.val() || {};
    const summary = {};

    Object.values(data).forEach(i => {

      const key = i.gmid + "|" + i.batch;

      if (!summary[key]) {
        summary[key] = { gmid:i.gmid, batch:i.batch, qty:0, weight:0 };
      }

      summary[key].qty++;
      summary[key].weight += i.weight;
    });

    render(summary);
  });
}

function processScan(scan) {

  let gmid = "";
  let batch = "";
  let weight = 0;

  const parts = scan.split(";");

  for (let p of parts) {

    if (p.startsWith("0100")) gmid = p.slice(-7);
    else if (p.startsWith("10")) batch = p.substring(2);
    else if (p.startsWith("3103")) weight = parseInt(p.substring(4)) / 1000;
  }

  if (!gmid || !batch || !weight) return;

  db.ref("scans").push({
    gmid,
    batch,
    weight,
    time: Date.now()
  });

  document.getElementById("status").innerText =
    `Sent ${gmid} | ${batch} | ${weight}`;
}

function render(summary) {

  const table = document.getElementById("table");
  table.innerHTML = "";

  Object.values(summary).forEach(i => {

    const row = table.insertRow();

    row.insertCell(0).innerText = i.gmid;
    row.insertCell(1).innerText = i.batch;
    row.insertCell(2).innerText = i.qty;
    row.insertCell(3).innerText = i.weight.toFixed(3);
  });
}

function resetAll() {
  db.ref("scans").remove();
}

function exportCSV() {
  db.ref("scans").once("value").then(snap => {

    const data = snap.val() || {};
    const summary = {};

    Object.values(data).forEach(i => {

      const key = i.gmid + "|" + i.batch;

      if (!summary[key]) {
        summary[key] = { gmid:i.gmid, batch:i.batch, qty:0, weight:0 };
      }

      summary[key].qty++;
      summary[key].weight += i.weight;
    });

    let csv = "GMID,Batch,Qty,Weight\n";

    Object.values(summary).forEach(i => {
      csv += `${i.gmid},${i.batch},${i.qty},${i.weight.toFixed(3)}\n`;
    });

    const blob = new Blob([csv], {type:"text/csv"});
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "warehouse.csv";
    a.click();
  });
}

</script>

</body>
</html>
