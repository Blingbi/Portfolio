<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js">
function loadMB52(){
allowedBatches={};
const lines=document.getElementById("mb52Input").value.split("\n");
let currentMaterial="";
lines.forEach(line=>{
 const m=line.match(/\|(\d{11})\s+/);
 if(m){currentMaterial=m[1];return;}
 const b=line.match(/\|207N\s+([A-Z0-9]+)\s+([\d,\.]+)\s+KG\s+([\d,\.]+)\s+([\d,\.]+)/);
 if(!b) return;
 const unrestricted=parseFloat(b[2].replace(/,/g,''))||0;
 const quality=parseFloat(b[3].replace(/,/g,''))||0;
 const blocked=parseFloat(b[4].replace(/,/g,''))||0;
 let status='NONE';
 if(blocked>0) status='BLOCKED'; else if(unrestricted>0) status='UNRESTRICTED'; else if(quality>0) status='QUALITY';
 allowedBatches[b[1]]={material:currentMaterial,status:status};
});
document.getElementById("mb52Count").innerText=Object.keys(allowedBatches).length;
document.getElementById("mb52Status").innerText='MB52 Loaded';
}
function scanMB52(raw){
let g="",b="",w=0;
raw.split(";").forEach(p=>{if(p.startsWith("0100")) g=p.slice(-7); if(p.startsWith("10")) b=p.slice(2); if(p.startsWith("3103")) w=parseInt(p.slice(4))/1000;});
if(!allowedBatches[b]) return playError("BATCH NOT IN MB52");
if(allowedBatches[b].status==="BLOCKED") return playError("BLOCKED INVENTORY");
if(document.getElementById("mb52Mode").value==="UNRESTRICTED" && allowedBatches[b].status==="QUALITY") return playError("QUALITY STOCK NOT ALLOWED");
mb52Scans.push({gmid:g,batch:b,status:allowedBatches[b].status,weight:w});
renderMB52(); successBeep.currentTime=0; successBeep.play();
}
function renderMB52(){
const t=document.getElementById("mb52Table"); t.innerHTML="";
mb52Scans.forEach(i=>{const r=t.insertRow(); r.insertCell(0).innerText=i.gmid; r.insertCell(1).innerText=i.batch; r.insertCell(2).innerText=i.status; r.insertCell(3).innerText=i.weight.toFixed(3);});
}

</script>

<style>

<body>

<div id="nav">
  <div class="navItem active" onclick="showPage('scanner')">Scanner</div>
  <div class="navItem" onclick="showPage('rules')">Rules</div>
  <div class="navItem" onclick="showPage('mobile')">Mobile</div>
  <div class="navItem" onclick="showPage('mb52')">MB52 Scanner</div>
</div>

<div class="container">

<!-- SCANNER -->
<div id="scannerPage">

<div class="card">

<select id="destinationSelect">
  <option value="">No Destination (optional)</option>
  <option value="CENTRAL">Central</option>
  <option value="CDW">CDW</option>
  <option value="INTERPLANT">Interplant</option>
  <option value="KVILLE">Kville</option>
</select>

<input id="scanInput" placeholder="Scan Data Matrix">

<button onclick="toggleRules()" id="rulesToggleBtn">Rules: ON</button>

<div class="status">
Rules Status: <span id="rulesStatus">ENABLED</span>
</div>

<button onclick="exportExcel()">Export Excel</button>
<button onclick="resetAll()">Reset All</button>

Total Weight: <span id="totalWeight">0.000</span>

<thead>
<tr>
<th>GMID</th>

</div>

<h3>Rules</h3>

<select id="ruleDestination">
  <option value="">Select Destination</option>
  <option value="CENTRAL">Central</option>
  <option value="CDW">CDW</option>
  <option value="INTERPLANT">Interplant</option>
  <option value="KVILLE">Kville</option>
</select>

<input id="ruleGMID" placeholder="GMID">

<button onclick="addRule()">Add Rule</button>

<table>
<thead>
<tr>
<th>Destination</th>
<th>GMID</th>
<th>Delete</th>
</tr>
</thead>

</table>

</div>
</div>

<!-- MB52 -->
<div id="mb52Page" class="hidden">

<h3>MB52 Validation Scanner</h3>
<textarea id="mb52Input" style="width:100%;height:250px;background:#0f151c;color:white;border:1px solid #263241;padding:10px;" placeholder="Paste MB52 report here"></textarea>
<button onclick="loadMB52()">Load MB52</button>
<select id="mb52Mode">
<option value="UNRESTRICTED">Unrestricted Only</option>
<option value="UNRESTRICTED_QUALITY">Unrestricted + Quality</option>
</select>
<input id="mb52ScanInput" placeholder="Scan Data Matrix">
<div class="status">Loaded Batches: <span id="mb52Count">0</span></div>
<table><thead><tr><th>GMID</th><th>Batch</th><th>Status</th><th>Weight</th></tr></thead><tbody id="mb52Table"></tbody></table>
<div id="mb52Status" class="status"></div>
</div></div>

</div>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyCJFDM58excT8iD6guuJyQajLxxnFVsHEg",
  authDomain: "warehouse-scanner-1b6bc.firebaseapp.com",
  databaseURL: "https://warehouse-scanner-1b6bc-default-rtdb.firebaseio.com",
  projectId: "warehouse-scanner-1b6bc"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

/* AUDIO */
const successBeep = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
const errorBeep = new Audio("ErrorBeep.mp3");

/* STATE */
let buffer="";
let timer=null;
let allRulesCache={};
let rulesEnabled=true;
let allowedBatches={};
let mb52Scans=[];

/* ERROR HANDLER */
function playError(msg){
  errorBeep.currentTime = 0;
  errorBeep.play();

  document.getElementById("status").innerText = msg;
  document.getElementById("status").style.color = "#ff6b6b";
}

/* NAV */
function showPage(p){

  document.getElementById("scannerPage").classList.add("hidden");
  document.getElementById("rulesPage").classList.add("hidden");
  document.getElementById("mobilePage").classList.add("hidden");
  document.getElementById("mb52Page").classList.add("hidden");

  if(p==="scanner") document.getElementById("scannerPage").classList.remove("hidden");
  if(p==="rules") document.getElementById("rulesPage").classList.remove("hidden");
  if(p==="mobile") document.getElementById("mobilePage").classList.remove("hidden");
  if(p==="mb52") document.getElementById("mb52Page").classList.remove("hidden");
}
function exportExcel(){

  db.ref("scans").once("value").then(snap=>{

    const data = snap.val() || {};
    const summary = {};

    Object.values(data).forEach(i=>{

      const key = i.gmid + "|" + i.batch + "|" + (i.dest || "UNASSIGNED");

      if(!summary[key]){
        summary[key] = {
          GMID: i.gmid,
          Batch: i.batch,
          Destination: i.dest || "UNASSIGNED",
          Qty: 0,
          Weight: 0
        };
      }

      summary[key].Qty += 1;
      summary[key].Weight += (i.weight || 0);
    });

    const rows = Object.values(summary).map(i=>({
      GMID: i.GMID,
      Batch: i.Batch,
      Destination: i.Destination,
      Qty: i.Qty,
      Weight: Number(i.Weight.toFixed(3))
    }));

    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(wb, ws, "Warehouse");

    XLSX.writeFile(wb, "warehouse_export.xlsx");

  }).catch(err=>{
    playError("EXPORT FAILED");
    console.log(err);
  });
}
/* START (FIXED - NO AUTH BLOCK) */
function start(){

  loadRules();

  document.getElementById("scanInput").addEventListener("input",e=>{
    buffer=e.target.value;
    clearTimeout(timer);

    timer=setTimeout(()=>{
      if(buffer.length > 0) scan(buffer);
      e.target.value="";
      buffer="";
    },100);
  });

  document.getElementById("mobileScan").addEventListener("input",e=>{
    buffer=e.target.value;
    clearTimeout(timer);

    timer=setTimeout(()=>{
      if(buffer.length > 0) scan(buffer);
      e.target.value="";
      buffer="";
    },100);
  });

  document.getElementById("mb52ScanInput").addEventListener("input",e=>{
    buffer=e.target.value; clearTimeout(timer);
    timer=setTimeout(()=>{ if(buffer.length>0) scanMB52(buffer); e.target.value=""; buffer=""; },100);
  });

  db.ref("scans").on("value",snap=>{

    const data=snap.val()||{};
    let total=0;
    let weight=0;
    let last="None";

    const summary={};

    Object.values(data).forEach(i=>{
      total++;
      weight+=i.weight;
      last=`${i.gmid} | ${i.batch}`;

      const k=i.gmid+"|"+i.batch;

      if(!summary[k]){
        summary[k]={gmid:i.gmid,batch:i.batch,dest:i.dest||"UNASSIGNED",qty:0,weight:0};
      }

      summary[k].qty++;
      summary[k].weight+=i.weight;
    });

    document.getElementById("totalCount").innerText=total;
    document.getElementById("totalWeight").innerText=weight.toFixed(3);
    document.getElementById("mTotal").innerText=total;
    document.getElementById("lastScan").innerText=last;

    render(summary);
  });
}

/* FORCE START IMMEDIATELY */
start();

/* SCAN */
function scan(s){

  let g="",b="",w=0;

  for(let p of s.split(";")){
    if(p.startsWith("0100")) g=p.slice(-7);
    if(p.startsWith("10")) b=p.slice(2);
    if(p.startsWith("3103")) w=parseInt(p.slice(4))/1000;
  }

  if(!g||!b||!w){
    playError("INVALID BARCODE");
    return;
  }

  const dest=document.getElementById("destinationSelect").value || "UNASSIGNED";

  if(rulesEnabled && allRulesCache){

    for(let d in allRulesCache){
      if(allRulesCache[d] && allRulesCache[d][g]){

        if(d !== dest){
          playError("RULE VIOLATION: " + g + " must go to " + d);
          return;
        }
      }
    }
  }

  db.ref("scans").push({
    gmid:g,
    batch:b,
    weight:w,
    dest:dest,
    time:Date.now()
  });

  successBeep.currentTime = 0;
  successBeep.play();
}

/* RENDER */
function render(sum){

  const t=document.getElementById("table");
  t.innerHTML="";

  Object.values(sum).forEach(i=>{
    const r=t.insertRow();

    r.insertCell(0).innerText=i.gmid;
    r.insertCell(1).innerText=i.batch;
    r.insertCell(2).innerText=i.dest;
    r.insertCell(3).innerText=i.qty;
    r.insertCell(4).innerText=i.weight.toFixed(3);
  });
}

/* RULES */
function toggleRules(){
  rulesEnabled=!rulesEnabled;

  const btn=document.getElementById("rulesToggleBtn");
  const status=document.getElementById("rulesStatus");

  btn.innerText = rulesEnabled ? "Rules: ON" : "Rules: OFF";
  status.innerText = rulesEnabled ? "ENABLED" : "DISABLED";
  status.style.color = rulesEnabled ? "#7ee787" : "#ff6b6b";
}

function addRule(){
  const d=document.getElementById("ruleDestination").value;
  const g=document.getElementById("ruleGMID").value.trim();
  if(!d||!g) return;
  db.ref("rules/"+d+"/"+g).set(true);
}

function loadRules(){
  db.ref("rules").on("value",snap=>{
    allRulesCache=snap.val()||{};
    renderRules();
  });
}
function resetAll(){

  if(!confirm("Clear ALL scans?")) return;

  db.ref("scans").remove().then(()=>{

    document.getElementById("status").innerText = "All scans cleared";
    document.getElementById("status").style.color = "#7ee787";

  }).catch(err=>{
    playError("RESET FAILED");
    console.log(err);
  });
}
function renderRules(){

  const table=document.getElementById("rulesTable");
  const search=(document.getElementById("ruleSearch").value||"").toLowerCase();

  table.innerHTML="";

  Object.keys(allRulesCache).forEach(dest=>{
    Object.keys(allRulesCache[dest]).forEach(gmid=>{

      if(!dest.toLowerCase().includes(search) &&
         !gmid.toLowerCase().includes(search)) return;

      const row=table.insertRow();

      row.insertCell(0).innerText=dest;
      row.insertCell(1).innerText=gmid;

      const cell=row.insertCell(2);

      const btn=document.createElement("button");
      btn.innerText="Delete";

      btn.onclick=()=>{
        db.ref("rules/"+dest+"/"+gmid).remove();
      };

      cell.appendChild(btn);
    });
  });
}

</script>
